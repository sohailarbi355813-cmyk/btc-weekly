<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav_pole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fav_fabric" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="22%" stop-color="#20242e" />
      <stop offset="48%" stop-color="#0a0b0f" />
      <stop offset="74%" stop-color="#2d323e" />
      <stop offset="95%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="fav_sheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="fav_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Pitch Black Badge Container -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#fav_border)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Realistic Waving Black Flag Centerpiece -->
  <g transform="translate(10, 8)">
    <!-- Flagpole Finial Ball -->
    <circle cx="8" cy="6" r="3.2" fill="#cbd5e1" />
    <circle cx="7" cy="5" r="1.0" fill="#ffffff" />

    <!-- Flagpole Mast -->
    <rect x="6.4" y="8" width="3.2" height="40" rx="1.6" fill="url(#fav_pole)" />
    <path d="M6 48 L10 48 L8 51 Z" fill="#334155" />

    <!-- Grommets -->
    <circle cx="8" cy="11" r="2.0" fill="none" stroke="#94a3b8" stroke-width="1" />
    <circle cx="8" cy="30" r="2.0" fill="none" stroke="#94a3b8" stroke-width="1" />

    <!-- Realistic Waving Black Cloth -->
    <path
      d="M 9.6 10.5
         C 18 8, 25 14.5, 33 11.5
         C 38.5 9.5, 42.5 12, 46 10
         C 45 18, 45.8 26, 43.5 33
         C 39.5 35, 35.5 32.5, 31 34.5
         C 22.5 38, 16 32, 9.6 34.5
         Z"
      fill="url(#fav_fabric)"
      stroke="#383c48"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Sheen reflection -->
    <path
      d="M 9.6 10.5
         C 18 8, 25 14.5, 33 11.5
         C 38.5 9.5, 42.5 12, 46 10
         C 45 18, 45.8 26, 43.5 33
         C 39.5 35, 35.5 32.5, 31 34.5
         C 22.5 38, 16 32, 9.6 34.5
         Z"
      fill="url(#fav_sheen)"
    />

    <!-- Deep Wave Shadows -->
    <path d="M 20 9.5 C 21.5 17, 20 27, 18 34" stroke="#000000" stroke-width="2.0" stroke-linecap="round" opacity="0.85" />
    <path d="M 21.8 9.5 C 23.3 17, 21.8 27, 19.8 34" stroke="#474f61" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M 34.5 11.5 C 35.5 18, 34.5 26, 32.5 34" stroke="#000000" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <path d="M 36.5 11.5 C 37.5 18, 36.5 26, 34.5 34" stroke="#5a637a" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
