<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="wolfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FACC15" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#090A0F" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Geometric Wolf Silhouette & Tape Levels -->
  <g transform="translate(8, 6)" filter="url(#wolfGlow)">
    <!-- Outer Wolf Crown / Ears -->
    <polygon points="24,4 10,14 16,28 24,38 32,28 38,14" fill="none" stroke="url(#wolfGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Muzzle Center Piece -->
    <polygon points="24,38 18,25 24,19 30,25" fill="url(#wolfGrad)" fill-opacity="0.25" stroke="url(#wolfGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Wolf Eyes -->
    <circle cx="18" cy="21" r="2.2" fill="#FDE047" />
    <circle cx="30" cy="21" r="2.2" fill="#FDE047" />
    <!-- Nose / Center Pivot -->
    <polygon points="24,34 21.5,30 26.5,30" fill="#FACC15" />
    <!-- Key Levels Tape Bars -->
    <line x1="4" y1="43" x2="44" y2="43" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="48" x2="38" y2="48" stroke="#FACC15" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>
